name: Validate reference CSV structure

on:
  push:
    paths:
      - 'housing_subscription_score_2026.csv'
      - 'private_housing_deposit_2026.csv'
      - 'widgets/apttosell-score-widget.js'
      - '.github/workflows/validate-reference-csv.yml'
  pull_request:
    paths:
      - 'housing_subscription_score_2026.csv'
      - 'private_housing_deposit_2026.csv'
      - 'widgets/apttosell-score-widget.js'
      - '.github/workflows/validate-reference-csv.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate score and deposit tables
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          def read(name):
              with Path(name).open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          scores = read("housing_subscription_score_2026.csv")
          groups = defaultdict(list)
          for row in scores:
              assert row["condition"] and row["base_date"] and row["canonical_source"]
              groups[row["category"]].append(row)
          expected = {"homeless_period": (17, 32), "dependents": (7, 35),
                      "subscription_account_period": (17, 17)}
          assert set(groups) == set(expected), "Unexpected score categories"
          assert len(scores) == 41, "Unexpected score row count"
          for category, (count, maximum) in expected.items():
              group = groups[category]
              assert len(group) == count, f"Unexpected count: {category}"
              assert len({r["condition"] for r in group}) == count, f"Duplicate condition: {category}"
              assert max(int(r["score"]) for r in group) == maximum, f"Unexpected maximum: {category}"
          assert sum(max(int(r["score"]) for r in group) for group in groups.values()) == 84

          deposits = read("private_housing_deposit_2026.csv")
          assert [r["housing_area"] for r in deposits] == [
              "85sqm_or_less", "102sqm_or_less", "135sqm_or_less", "all_areas"]
          for row in deposits:
              assert row["unit"] == "KRW_10k"
              assert row["source_basis"] and row["checked_date"]
          for col in ("seoul_busan", "other_metropolitan", "other_city_county"):
              amounts = [int(r[col]) for r in deposits]
              assert amounts == sorted(amounts) and min(amounts) > 0
          print(f"PASS: {len(scores)} score rows, {len(deposits)} deposit rows, max 84 points")
          print("Structural consistency only; not a legal-currentness check.")
          PY
      - name: Compare live score widget options with the reference CSV
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import re
          from itertools import product
          from pathlib import Path

          js = Path("widgets/apttosell-score-widget.js").read_text(encoding="utf-8")
          with Path("housing_subscription_score_2026.csv").open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          categories = {
              "homeless": "homeless_period",
              "dependents": "dependents",
              "account": "subscription_account_period",
          }
          options = {}
          for name, category in categories.items():
              match = re.search(r"const\s+" + name + r"\s*=\s*(\[[^\n]+\]);", js)
              assert match, f"Missing widget array: {name}"
              options[name] = [int(x) for x in re.findall(r"\['[^']+',\s*(\d+)\]", match.group(1))]
              expected = [int(row["score"]) for row in rows if row["category"] == category]
              assert options[name] == expected, f"Widget/CSV discrepancy: {name}"
          spouse_match = re.search(r"const\s+spouse\s*=\s*(\[[^\n]+\]);", js)
          assert spouse_match, "Missing spouse selection"
          spouse = [int(x) for x in re.findall(r"\['[^']+',\s*(\d+)\]", spouse_match.group(1))]
          assert spouse == [0, 1, 2, 3], "Unexpected spouse option scores"
          assert "Math.min(17,a+s)" in js, "Account-points cap not found"
          cases = 0
          for h, d, a, s in product(options["homeless"], options["dependents"], options["account"], spouse):
              assert h + d + min(17, a+s) <= 84, "Result exceeds 84 points"
              cases += 1
          assert cases == 8092, f"Unexpected widget input space: {cases}"
          print(f"PASS: score widget matches 41 CSV rows; {cases} combinations obey 84-point cap")
          print("These tests do not certify applicant eligibility or current legal rules.")
          PY
